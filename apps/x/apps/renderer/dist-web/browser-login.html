<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Login — Divinity Works</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #e5e5e5; }

    #banner {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a;
      font-size: 13px;
    }
    #banner .left { display: flex; align-items: center; gap: 8px; }
    #banner .url { color: #888; font-size: 12px; }
    #banner button {
      background: #d4af37; color: #000; border: none; padding: 6px 14px;
      border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    #banner button:hover { background: #c4a030; }
    #banner .spinner {
      width: 14px; height: 14px; border: 2px solid #444;
      border-top-color: #d4af37; border-radius: 50%;
      animation: spin 0.8s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #frame-container { width: 100%; height: calc(100% - 40px); }
    #frame-container iframe { width: 100%; height: 100%; border: none; background: #fff; }

    #loading-overlay {
      position: absolute; top: 40px; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(10,10,10,0.9); z-index: 10;
    }
    #loading-overlay .msg { text-align: center; }
    #loading-overlay .msg .icon { font-size: 32px; margin-bottom: 8px; }
    #loading-overlay .msg .text { color: #888; font-size: 14px; }
  </style>
</head>
<body>
  <div id="banner">
    <div class="left">
      <span id="site-icon">🌐</span>
      <span id="site-name">Loading...</span>
      <span class="url" id="site-url"></span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="spinner" id="spin"></div>
      <button id="done-btn">I'm logged in — Save session</button>
    </div>
  </div>

  <div id="loading-overlay">
    <div class="msg">
      <div class="icon">⏳</div>
      <div class="text">Opening login page...</div>
    </div>
  </div>

  <div id="frame-container">
    <iframe id="browser-frame" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
  </div>

  <script>
    // ── Get URL params ──
    var params = new URLSearchParams(window.location.search);
    var targetUrl = params.get('url');
    var domain = '';

    try { domain = new URL(targetUrl).hostname.replace(/^www\./, ''); }
    catch (e) { domain = targetUrl; }

    // ── Set up banner ──
    document.getElementById('site-url').textContent = targetUrl;
    document.getElementById('site-name').textContent = domain;

    // Try favicon
    var favicon = new Image();
    favicon.src = 'https://www.google.com/s2/favicons?domain=' + domain + '&sz=32';
    favicon.onload = function() {
      document.getElementById('site-icon').innerHTML = '';
      document.getElementById('site-icon').appendChild(favicon);
      favicon.style.width = '16px'; favicon.style.height = '16px';
    };

    // ── IMPORTANT: Due to X-Frame-Options and CORS, most login pages
    // cannot be iframed. We redirect the user to the actual login URL
    // in this tab, and when they're done, they click "Save session"
    // to come back. ──

    // For now, redirect to the actual URL in this tab
    if (targetUrl) {
      window.location.href = targetUrl;
    }

    // The "Save session" flow works like this:
    // 1. User clicks "Log in" in chat → opens this page
    // 2. We redirect to the actual login URL
    // 3. User authenticates on the real site
    // 4. We inject a floating "Save" button via bookmarklet/popup
    // 5. User clicks Save → we signal parent window → cookies captured

    // Listen for "done" signal from parent (postMessage)
    window.addEventListener('message', function(event) {
      if (event.data === 'dw:loginDone') {
        document.getElementById('spin').style.display = 'inline-block';
        document.getElementById('done-btn').textContent = 'Saving...';
        // Signal back to parent
        window.opener.postMessage('dw:loginComplete:' + domain, '*');
        setTimeout(function() { window.close(); }, 1500);
      }
    });

    // "Save session" button
    document.getElementById('done-btn').addEventListener('click', function() {
      document.getElementById('spin').style.display = 'inline-block';
      this.textContent = 'Saving...';
      this.disabled = true;
      // Signal to parent window that login is complete
      if (window.opener) {
        window.opener.postMessage('dw:loginComplete:' + domain, '*');
      }
      setTimeout(function() { window.close(); }, 1500);
    });
  </script>
</body>
</html>
